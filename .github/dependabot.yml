version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        # Majors stay individual, on purpose. A breaking major inside a grouped
        # pull request makes the whole thing unmergeable, which is exactly the
        # hand-unpicking this grouping exists to prevent.
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
